name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true
  - type: input
    id: mouse
    attributes:
      label: Mouse and connection
      placeholder: ISY IWN-5000-1 over USB receiver
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
